<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1f2933">
<title>Radar Inmobiliario</title>
<style>
  :root {
    --bg: #f5f7fa; --card: #fff; --ink: #1f2933; --muted: #616e7c; --line: #e4e7eb;
    --accent: #3949ab; --good: #1a7f4b; --mid: #b7791f; --bad: #c53030; --chip: #eef2ff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1419; --card: #1a2027; --ink: #e6e9ed; --muted: #9aa5b1; --line: #2d3640;
            --accent: #7986cb; --chip: #252d4a; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif;
         padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  header { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--line); padding: 10px 16px; }
  header h1 { font-size: 17px; margin: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  header small { color: var(--muted); font-weight: normal; font-size: 12px; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .filters select, .filters input { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px;
                                    background: var(--bg); color: var(--ink); min-width: 0; }
  .filters input[type=search] { flex: 1 1 160px; }
  .filters label { display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--muted); }
  main { max-width: 1200px; margin: 0 auto; padding: 14px 16px 40px; }
  .zones { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 10px; }
  .zone { flex: 0 0 auto; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-size: 12px; }
  .zone b { display: block; font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; cursor: pointer;
          display: flex; flex-direction: column; }
  .card img { width: 100%; aspect-ratio: 4/3; object-fit: cover; background: var(--line); display: block; }
  .card .body { padding: 10px 12px; flex: 1; }
  .score { float: right; color: #fff; font-weight: 700; border-radius: 16px; padding: 2px 9px; }
  .price { font-size: 17px; font-weight: 700; }
  .muted { color: var(--muted); font-size: 12px; }
  .chips { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { background: var(--chip); color: var(--accent); font-size: 11px; padding: 2px 6px; border-radius: 4px; }
  .chip.bad { background: #fde8e8; color: var(--bad); }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 8px; text-align: center; }
  .kpis div { background: var(--bg); border-radius: 6px; padding: 4px 2px; }
  .kpis b { display: block; font-size: 14px; }
  .kpis span { font-size: 10px; color: var(--muted); }
  .empty { text-align: center; color: var(--muted); padding: 40px; }
  #login { max-width: 340px; margin: 18vh auto; background: var(--card); padding: 24px; border-radius: 12px; border: 1px solid var(--line); }
  #login input, #login button { width: 100%; font: inherit; padding: 10px; border-radius: 8px; border: 1px solid var(--line);
                                margin-top: 10px; background: var(--bg); color: var(--ink); }
  #login button, .btn { background: var(--accent); color: #fff; border: 0; cursor: pointer; }
  .btn { display: inline-block; padding: 8px 14px; border-radius: 6px; text-decoration: none; font: inherit; }
  dialog { border: 0; border-radius: 12px; padding: 0; width: min(760px, 96vw); max-height: 92vh; background: var(--card); color: var(--ink); }
  dialog::backdrop { background: rgba(0,0,0,.5); }
  .dlg { padding: 16px; }
  .dlg h2 { margin: 0 0 4px; font-size: 18px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 640px) { .two { grid-template-columns: 1fr; } .kpis b { font-size: 13px; } }
  table.m { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.m td { padding: 3px 0; border-bottom: 1px solid var(--line); }
  table.m td:last-child { text-align: right; font-weight: 600; }
  .calc label { display: flex; justify-content: space-between; align-items: center; font-size: 13px; margin: 4px 0; gap: 8px; }
  .calc input { width: 110px; font: inherit; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); text-align: right; }
  .ai { background: var(--bg); border-left: 3px solid var(--accent); padding: 8px 10px; border-radius: 4px; font-size: 13px; margin: 10px 0; }
  textarea { width: 100%; min-height: 70px; font: inherit; border: 1px solid var(--line); border-radius: 6px; padding: 6px; background: var(--bg); color: var(--ink); }
  .close { float: right; background: none; border: 0; font-size: 24px; cursor: pointer; color: var(--muted); }
  .desc { font-size: 13px; color: var(--muted); white-space: pre-line; max-height: 160px; overflow: auto; }
  /* ---- mapa (Leaflet se descarga solo al abrirlo) ---- */
  .mapbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px;
            background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
  .mapbar .btn { padding: 6px 12px; }
  #map { position: relative; z-index: 0; /* que las capas de Leaflet no tapen la cabecera fija */
         height: 0; border-radius: 10px; overflow: hidden; margin-bottom: 0; border: 1px solid transparent; transition: height .25s; }
  #map.open { height: min(60vh, 520px); margin-bottom: 12px; border-color: var(--line); }
  .pin { background: var(--card); color: var(--ink); border: 2px solid; border-radius: 12px; padding: 1px 6px;
         font: 700 11px/16px -apple-system, "Segoe UI", Roboto, sans-serif; white-space: nowrap;
         box-shadow: 0 1px 3px rgba(0,0,0,.35); transform: translate(-50%, -50%); width: max-content; }
  .pin.fav::before { content: "★ "; }
  .leaflet-div-icon.pin-wrap { background: none; border: 0; }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--card); color: var(--ink); }
  .leaflet-popup-content { margin: 10px; width: 220px !important; }
  .pop img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 6px; background: var(--line); display: block; }
  .pop .price { margin-top: 6px; }
  .pop .acts { display: flex; gap: 6px; margin-top: 8px; }
  .pop .acts a, .pop .acts button { flex: 1; text-align: center; padding: 6px; font-size: 12px; border-radius: 6px; }
  .pop .acts button { border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; font: inherit; font-size: 12px; }
  .leaflet-popup-content-wrapper a.btn { color: #fff; }
</style>
</head>
<body>

<div id="login">
  <h2 style="margin:0">🏠 Radar Inmobiliario</h2>
  <p class="muted">Introduce la contraseña del panel.</p>
  <form id="loginForm">
    <input type="password" id="pw" autocomplete="current-password" placeholder="Contraseña" required>
    <label class="muted" style="display:flex;gap:6px;margin-top:8px"><input type="checkbox" id="remember" style="width:auto;margin:0"> Recordar en este dispositivo</label>
    <button type="submit">Entrar</button>
    <p id="loginErr" class="muted" style="color:var(--bad)" hidden>Contraseña incorrecta.</p>
  </form>
</div>

<div id="app" hidden>
  <header>
    <h1>🏠 Radar <small id="gen"></small></h1>
    <div class="filters">
      <input type="search" id="q" placeholder="Buscar barrio, calle, texto…">
      <select id="fZone"><option value="">Todas las zonas</option></select>
      <select id="fStrat"><option value="">Estrategia</option></select>
      <select id="fState"><option value="">Todos los estados</option></select>
      <select id="sort">
        <option value="score">Mejor puntuación</option><option value="mult">Menor múltiplo</option>
        <option value="net">Mayor rent. neta</option><option value="cf">Mayor cash flow</option>
        <option value="price">Más baratos</option><option value="recent">Más recientes</option>
      </select>
      <label>Punt. ≥ <input type="number" id="fScore" value="40" min="0" max="100" style="width:58px"></label>
      <label>Precio ≤ <input type="number" id="fPrice" step="5000" placeholder="€" style="width:90px"></label>
      <label><input type="checkbox" id="fNew"> Solo nuevos</label>
      <label><input type="checkbox" id="fFav"> ★ Favoritos</label>
    </div>
  </header>
  <main>
    <div class="mapbar">
      <span class="muted" id="mapInfo">Mapa de los anuncios filtrados</span>
      <button class="btn" id="mapBtn" type="button">🗺️ Ver mapa</button>
    </div>
    <div id="map" hidden></div>
    <div class="zones" id="zones"></div>
    <p class="muted" id="count"></p>
    <div class="grid" id="grid"></div>
  </main>
</div>

<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>

<script>
const STATES = ["Nuevo", "Visto", "Llamado", "Visitado", "Oferta", "Descartado"];
let DATA = null, VIEW = [];
const $ = (s) => document.querySelector(s);
const eur = (x) => x == null ? "—" : Math.round(x).toLocaleString("es-ES") + " €";
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const color = (s) => s >= 70 ? "var(--good)" : s >= 50 ? "var(--mid)" : "var(--bad)";
// Nombres de estrategia desde config.yaml (los datos antiguos no los traen)
const STRATS = () => DATA.meta.estrategias || { larga: "Larga duración", vacacional: "Vacacional" };
// En la búsqueda de vivienda propia la puntuación de inversión no aplica: se muestran todas
const isHome = (l) => l.v.estrategia === "jubilacion";

// ---- estado local por dispositivo (favoritos, estados, notas) -------------
function store() { try { return JSON.parse(localStorage.getItem("radar-user") || "{}"); } catch { return {}; } }
function saveStore(s) { try { localStorage.setItem("radar-user", JSON.stringify(s)); } catch {} }
function userOf(id) { return store()[id] || {}; }
function setUser(id, patch) { const s = store(); s[id] = { ...(s[id] || {}), ...patch }; saveStore(s); }

// ---- descifrado ------------------------------------------------------------
const b64 = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(enc, password) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(enc.salt), iterations: enc.iter, hash: "SHA-256" },
                                            base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(enc.iv) }, key, b64(enc.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}
async function unlock(pw) {
  const enc = await (await fetch("data.enc.json?t=" + Date.now())).json();
  DATA = await decrypt(enc, pw);
  $("#login").hidden = true; $("#app").hidden = false;
  init();
}
$("#loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const pw = $("#pw").value;
  try {
    await unlock(pw);
    if ($("#remember").checked) try { localStorage.setItem("radar-pw", pw); } catch {}
  } catch { $("#loginErr").hidden = false; }
});
(async () => { let pw = null; try { pw = localStorage.getItem("radar-pw"); } catch {}
  if (pw) try { await unlock(pw); } catch { try { localStorage.removeItem("radar-pw"); } catch {} } })();

// ---- listado ---------------------------------------------------------------
function init() {
  $("#gen").textContent = "actualizado " + DATA.meta.generado;
  for (const z of DATA.meta.zonas) $("#fZone").insertAdjacentHTML("beforeend", `<option value="${z.id}">${esc(z.nombre)}</option>`);
  for (const s of STATES) $("#fState").insertAdjacentHTML("beforeend", `<option>${s}</option>`);
  for (const [k, name] of Object.entries(STRATS()))
    $("#fStrat").insertAdjacentHTML("beforeend", `<option value="${esc(k)}">${esc(name)}</option>`);
  $("#zones").innerHTML = DATA.meta.zonas.map(z => `<div class="zone"><b>${esc(z.nombre)}</b>
    ${esc(STRATS()[z.estrategia] || z.estrategia)} · ${z.activos} activos · ${z.nuevos} nuevos<br>alquiler ${z.alquiler_m2 ?? "—"} €/m² · venta ${z.venta_m2 ?? "—"} €/m²</div>`).join("");
  for (const id of ["#q", "#fZone", "#fStrat", "#fState", "#sort", "#fScore", "#fPrice", "#fNew", "#fFav"])
    $(id).addEventListener("input", () => render());
  $("#mapBtn").addEventListener("click", toggleMap);
  render();
}

// refit=false cuando el cambio viene de la ficha (favorito/estado), para no mover el mapa
function render(refit = true) {
  const q = $("#q").value.toLowerCase(), zone = $("#fZone").value, strat = $("#fStrat").value, st = $("#fState").value;
  const minScore = +$("#fScore").value || 0, maxPrice = +$("#fPrice").value || Infinity;
  const onlyNew = $("#fNew").checked, onlyFav = $("#fFav").checked;
  VIEW = DATA.listings.filter(l => {
    const u = userOf(l.id);
    if (zone && l.zone !== zone) return false;
    if (strat && l.v.estrategia !== strat) return false;
    if (st && (u.estado || "Nuevo") !== st) return false;
    if (!st && u.estado === "Descartado") return false;
    if ((!isHome(l) && l.v.puntuacion < minScore) || l.price > maxPrice) return false;
    if (onlyNew && l.first_seen !== DATA.meta.hoy) return false;
    if (onlyFav && !u.fav) return false;
    if (q && !`${l.title} ${l.location} ${l.desc}`.toLowerCase().includes(q)) return false;
    return true;
  });
  const sorters = { score: (a, b) => b.v.puntuacion - a.v.puntuacion, mult: (a, b) => a.v.multiplo - b.v.multiplo,
    net: (a, b) => b.v.rent_neta - a.v.rent_neta, cf: (a, b) => b.v.cashflow_mes - a.v.cashflow_mes,
    price: (a, b) => a.price - b.price, recent: (a, b) => b.first_seen.localeCompare(a.first_seen) };
  VIEW.sort(sorters[$("#sort").value]);
  $("#count").textContent = `${VIEW.length} anuncios`;
  $("#grid").innerHTML = VIEW.slice(0, 300).map(card).join("") || `<div class="empty">Sin resultados con estos filtros.</div>`;
  const located = VIEW.filter(l => l.geo).length;
  $("#mapInfo").textContent = DATA.listings.some(l => l.geo)
    ? `${located} de ${VIEW.length} anuncios en el mapa`
    : "Las ubicaciones se generan en la próxima ejecución del radar";
  if (MAP && $("#map").classList.contains("open")) drawMarkers(refit);
}

// ---- mapa ------------------------------------------------------------------
const LEAFLET = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/";
const CLUSTER = "https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/";
let MAP = null, LAYER = null, MAP_LOADING = null;
const loadCss = (href) => document.head.insertAdjacentHTML("beforeend", `<link rel="stylesheet" href="${href}">`);
const loadJs = (src) => new Promise((ok, ko) => {
  const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = ko; document.head.appendChild(s);
});
async function loadLeaflet() {
  loadCss(LEAFLET + "leaflet.min.css"); loadCss(CLUSTER + "MarkerCluster.min.css"); loadCss(CLUSTER + "MarkerCluster.Default.min.css");
  await loadJs(LEAFLET + "leaflet.min.js");
  await loadJs(CLUSTER + "leaflet.markercluster.js");
}

async function toggleMap() {
  const box = $("#map"), btn = $("#mapBtn");
  if (box.classList.contains("open")) {
    box.classList.remove("open"); btn.textContent = "🗺️ Ver mapa";
    setTimeout(() => { box.hidden = true; }, 250);
    return;
  }
  box.hidden = false; btn.textContent = "Cargando…"; btn.disabled = true;
  try {
    MAP_LOADING = MAP_LOADING || loadLeaflet();
    await MAP_LOADING;
  } catch {
    MAP_LOADING = null; btn.disabled = false; btn.textContent = "🗺️ Ver mapa";
    $("#mapInfo").textContent = "No se pudo cargar el mapa (¿sin conexión?).";
    return;
  }
  requestAnimationFrame(() => box.classList.add("open"));
  btn.textContent = "Ocultar mapa"; btn.disabled = false;
  if (!MAP) {
    MAP = L.map(box, { zoomControl: true }).setView([40.2, -3.7], 6);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' }).addTo(MAP);
    LAYER = L.markerClusterGroup({ maxClusterRadius: 45, showCoverageOnHover: false, spiderfyOnMaxZoom: true });
    MAP.addLayer(LAYER);
  }
  setTimeout(() => { MAP.invalidateSize(); drawMarkers(true); }, 260);
}

// Desplazamiento fijo por anuncio: los que comparten barrio/municipio no quedan apilados en el mismo punto
function jitter(l) {
  const [lat, lon, prec] = l.geo;
  const r = { calle: 0.0004, barrio: 0.003, municipio: 0.007 }[prec] || 0;
  let h = 0; for (const c of l.id) h = (h * 31 + c.charCodeAt(0)) | 0;
  const a = (h % 360) * Math.PI / 180, d = r * (0.3 + ((h >>> 8) % 70) / 100);
  return [lat + d * Math.sin(a), lon + d * Math.cos(a) / Math.cos(lat * Math.PI / 180)];
}
const shortPrice = (p) => p >= 1e6 ? (p / 1e6).toFixed(2).replace(".", ",") + " M€" : Math.round(p / 1000) + " k€";

function drawMarkers(refit) {
  LAYER.clearLayers();
  const markers = VIEW.filter(l => l.geo).map(l => {
    const u = userOf(l.id);
    const icon = L.divIcon({ className: "pin-wrap", iconSize: null,
      html: `<div class="pin${u.fav ? " fav" : ""}" style="border-color:${isHome(l) ? "var(--accent)" : color(l.v.puntuacion)}">${shortPrice(l.price)}</div>` });
    return L.marker(jitter(l), { icon, title: l.title || "" }).bindPopup(() => popup(l), { maxWidth: 240 });
  });
  LAYER.addLayers(markers);
  if (!refit) return;
  if (markers.length) return MAP.fitBounds(LAYER.getBounds(), { padding: [30, 30], maxZoom: 15 });
  // Sin anuncios ubicados: centrar en la zona elegida (o en las zonas de alguna estrategia)
  const zones = DATA.meta.zonas.filter(z => z.centro && (!$("#fZone").value || z.id === $("#fZone").value));
  if (zones.length === 1) MAP.setView(zones[0].centro, 10);
  else if (zones.length) MAP.fitBounds(zones.map(z => z.centro), { padding: [40, 40] });
}

function popup(l) {
  const v = l.v, prec = l.geo[2];
  return `<div class="pop">
    ${l.photo ? `<img src="${esc(l.photo)}" alt="">` : ""}
    <div class="price">${eur(l.price)} ${isHome(l) ? "" : `<span class="score" style="background:${color(v.puntuacion)}">${v.puntuacion}</span>`}</div>
    <div style="font-size:13px">${esc(l.title)}</div>
    <div class="muted">${l.m2 ?? "?"} m² · ${l.rooms ?? "?"} hab · múltiplo ${v.multiplo}</div>
    <div class="muted">${esc(l.location)}${prec !== "calle" ? ` · <i>ubicación aproximada (${prec})</i>` : ""}</div>
    <div class="acts"><button type="button" onclick="openDetail('${esc(l.id)}')">Ficha y cálculo</button>
      <a class="btn" href="${esc(l.url)}" target="_blank" rel="noopener">Anuncio ↗</a></div></div>`;
}

function card(l) {
  const v = l.v, u = userOf(l.id);
  const chips = [];
  if (l.first_seen === DATA.meta.hoy) chips.push(`<span class="chip">NUEVO</span>`);
  if (v.bajadas_pct.length) chips.push(`<span class="chip">−${v.bajadas_pct[0]}%</span>`);
  if (v.ia) chips.push(`<span class="chip">IA: ${esc(v.ia.veredicto)}</span>`);
  if (u.estado && u.estado !== "Nuevo") chips.push(`<span class="chip">${esc(u.estado)}</span>`);
  for (const r of v.riesgos) chips.push(`<span class="chip bad">⚠ ${esc(r)}</span>`);
  return `<div class="card" onclick="openDetail('${esc(l.id)}')">
    ${l.photo ? `<img loading="lazy" src="${esc(l.photo)}" alt="">` : ""}
    <div class="body">
      ${isHome(l) ? "" : `<span class="score" style="background:${color(v.puntuacion)}">${v.puntuacion}</span>`}
      <div class="muted">${u.fav ? "★ " : ""}${esc(l.zone_name)} · ${esc(l.source)}</div>
      <div class="price">${eur(l.price)}</div>
      <div class="muted">${l.m2 ?? "?"} m² · ${l.rooms ?? "?"} hab · ${esc(l.floor || "")}</div>
      <div style="font-size:13px">${esc(l.title)}</div>
      <div class="muted">${esc(l.location)}</div>
      ${isHome(l)
        ? `<div class="kpis"><div><b>${l.m2 ? eur(l.price / l.m2) : "—"}</b><span>€/m²</span></div><div><b>${l.m2 ?? "?"}</b><span>m²</span></div>
            <div><b>${l.rooms ?? "?"}</b><span>hab</span></div><div><b>${l.first_seen.slice(8, 10)}/${l.first_seen.slice(5, 7)}</b><span>publicado</span></div></div>`
        : `<div class="kpis"><div><b>${v.multiplo}</b><span>múltiplo</span></div><div><b>${v.rent_neta}%</b><span>neta</span></div>
            <div><b>${eur(v.cashflow_mes)}</b><span>cash flow</span></div><div><b>${v.roce}%</b><span>ROCE</span></div></div>`}
      <div class="chips">${chips.join("")}</div>
    </div></div>`;
}

// ---- detalle + calculadora -------------------------------------------------
function openDetail(id) {
  const l = DATA.listings.find(x => x.id === id), v = l.v, u = userOf(id), f = DATA.meta.financiacion;
  const vac = v.estrategia === "vacacional";
  const taxPct = Math.round((v.impuestos_gastos / l.price) * 1000) / 10;
  const hist = l.hist.length > 1 ? l.hist.map(([d, p]) => `${d.slice(5)}: ${eur(p)}`).join(" → ") : "Sin cambios registrados";
  const ai = v.ia ? `<div class="ai"><b>Análisis IA · ${esc(v.ia.veredicto)}</b><br>${esc(v.ia.comentario)}
      <br><b>A favor:</b> ${v.ia.puntos_fuertes.map(esc).join("; ")}
      <br><b>Riesgos:</b> ${v.ia.riesgos.map(esc).join("; ")}
      <br><b>Preguntar al vendedor:</b><ul style="margin:2px 0;padding-left:18px">${v.ia.preguntas_vendedor.map(q => `<li>${esc(q)}</li>`).join("")}</ul></div>` : "";
  const income = vac
    ? `<tr><td>ADR estimado · ocupación</td><td>${eur(v.ingresos.adr)} · ${Math.round(v.ingresos.ocupacion * 100)}%</td></tr>
       <tr><td>Ingresos brutos/año</td><td>${eur(v.ingresos.ingresos_brutos_anuales)}</td></tr>
       <tr><td>Alternativa larga duración</td><td>${eur(v.ingresos.alquiler_larga_alternativo)}/mes</td></tr>`
    : `<tr><td>Alquiler estimado</td><td>${eur(v.ingresos.alquiler_mensual)}/mes</td></tr>`;
  $("#dlgBody").innerHTML = `
    <button class="close" onclick="$('#dlg').close()" aria-label="Cerrar">×</button>
    <h2>${eur(l.price)} · ${esc(l.title)}</h2>
    <div class="muted">${esc(l.location)} · ${l.m2 ?? "?"} m² · ${l.rooms ?? "?"} hab · ${l.baths ?? "?"} baños · ${esc(l.floor || "")}</div>
    <p><span class="score" style="background:${color(v.puntuacion)};float:none">${v.puntuacion}</span>
      <b>${esc(v.tipo_libro)}</b> · Regla del 150: <b>${v.multiplo}</b> (${v.calidad})</p>
    ${ai}
    <div class="two">
      <div>
        <table class="m">
          ${income}
          <tr><td>Ref. alquiler (€/m²)</td><td>${v.alquiler_m2} · <span class="muted">${esc(v.alquiler_ref)}</span></td></tr>
          <tr><td>ITP + gastos compra</td><td>${eur(v.impuestos_gastos)}</td></tr>
          <tr><td>Reforma estimada</td><td>${eur(v.reforma)}</td></tr>
          ${vac ? `<tr><td>Mobiliario</td><td>${eur(v.mobiliario)}</td></tr>` : ""}
          <tr><td>Coste total</td><td>${eur(v.coste_total)}</td></tr>
          <tr><td>Gastos anuales</td><td>${eur(v.gastos_anuales)}</td></tr>
          <tr><td>Rentab. bruta / neta</td><td>${v.rent_bruta}% / ${v.rent_neta}%</td></tr>
          <tr><td>Cuota hipoteca</td><td>${eur(v.cuota_hipoteca)}/mes</td></tr>
          <tr><td>Capital aportado</td><td>${eur(v.capital_aportado)}</td></tr>
          <tr><td>Cash flow · ROCE</td><td>${eur(v.cashflow_mes)}/mes · ${v.roce}%</td></tr>
          <tr><td>€/m² venta zona</td><td>${v.venta_m2_zona ? eur(v.venta_m2_zona) : "—"} ${v.bajo_mercado_pct != null ? `(${v.bajo_mercado_pct > 0 ? "−" : "+"}${Math.abs(v.bajo_mercado_pct)}%)` : ""}</td></tr>
          <tr><td>Oferta para múltiplo 150</td><td>${eur(v.precio_objetivo_150)} (${v.descuento_necesario_pct > 0 ? "−" + v.descuento_necesario_pct + "%" : "ya cumple"})</td></tr>
        </table>
        <p class="muted">Precio: ${esc(hist)}</p>
        ${v.senales.length ? `<p style="color:var(--good);font-size:13px">✔ ${v.senales.map(esc).join(", ")}</p>` : ""}
        ${v.riesgos.length ? `<p style="color:var(--bad);font-size:13px">⚠ ${v.riesgos.map(esc).join(", ")}</p>` : ""}
        ${v.aviso_normativo ? `<p class="muted">📜 ${esc(v.aviso_normativo)}</p>` : ""}
        ${v.notas.map(n => `<p class="muted">ℹ ${esc(n)}</p>`).join("")}
      </div>
      <div class="calc">
        <b>Calculadora editable</b>
        <label>Precio compra <input id="cP" type="number" value="${l.price}"></label>
        <label>${vac ? "Ingreso neto mensual (tras gestión)" : "Alquiler mensual"} <input id="cR" type="number" value="${v.ingreso_mensual_regla}"></label>
        <label>ITP + gastos (%) <input id="cT" type="number" step="0.1" value="${taxPct}"></label>
        <label>Reforma + mobiliario <input id="cRef" type="number" value="${v.reforma + v.mobiliario}"></label>
        <label>Otros gastos anuales <input id="cG" type="number" value="${v.gastos_otros_calc}"></label>
        <label>Financiación (% precio) <input id="cL" type="number" value="${Math.round(f.ltv * 100)}"></label>
        <label>Interés fijo (%) <input id="cI" type="number" step="0.05" value="${(f.interes * 100).toFixed(2)}"></label>
        <label>Años <input id="cY" type="number" value="${f.anios}"></label>
        <table class="m" id="cOut" style="margin-top:8px"></table>
      </div>
    </div>
    <h3 style="font-size:15px">Seguimiento</h3>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <select id="uState">${STATES.map(s => `<option ${((u.estado || "Nuevo") === s) ? "selected" : ""}>${s}</option>`).join("")}</select>
      <label><input type="checkbox" id="uFav" ${u.fav ? "checked" : ""}> ★ Favorito</label>
      <a class="btn" href="${esc(l.url)}" target="_blank" rel="noopener">Ver anuncio en ${esc(l.source)} →</a>
      ${(l.otros_portales || []).map(u2 => `<a href="${esc(u2)}" target="_blank" rel="noopener">otro portal</a>`).join(" ")}
    </div>
    <p><textarea id="uNotes" placeholder="Notas: llamada, visita, estado de la finca, derramas…">${esc(u.notas || "")}</textarea></p>
    <details><summary class="muted">Descripción del anuncio</summary><p class="desc">${esc(l.desc)}</p></details>`;
  const calc = () => {
    const P = +$("#cP").value, R = +$("#cR").value, T = +$("#cT").value / 100, REF = +$("#cRef").value, G = +$("#cG").value;
    const L = +$("#cL").value / 100, I = +$("#cI").value / 100 / 12, N = +$("#cY").value * 12;
    const total = P * (1 + T) + REF, loan = P * L, equity = total - loan;
    const pay = I ? loan * I / (1 - Math.pow(1 + I, -N)) : loan / N;
    const net = R * 12 - G, cf = net / 12 - pay, mult = total / R;
    const label = mult < 150 ? "Extraordinaria" : mult < 180 ? "Buena" : mult < 210 ? "Correcta" : mult < 240 ? "Regular" : "Mala";
    $("#cOut").innerHTML = `<tr><td>Coste total</td><td>${eur(total)}</td></tr>
      <tr><td>Múltiplo (regla 150)</td><td>${Math.round(mult)} · ${label}</td></tr>
      <tr><td>Rentab. bruta / neta</td><td>${(R * 12 / total * 100).toFixed(2)}% / ${(net / total * 100).toFixed(2)}%</td></tr>
      <tr><td>Cuota</td><td>${eur(pay)}/mes</td></tr>
      <tr><td>Capital aportado</td><td>${eur(equity)}</td></tr>
      <tr><td>Cash flow</td><td style="color:${cf >= 0 ? "var(--good)" : "var(--bad)"}">${eur(cf)}/mes</td></tr>
      <tr><td>ROCE</td><td>${equity > 0 ? (cf * 12 / equity * 100).toFixed(1) : "—"}%</td></tr>`;
  };
  $("#dlgBody").querySelectorAll(".calc input").forEach(i => i.addEventListener("input", calc));
  calc();
  $("#uState").addEventListener("change", e => { setUser(id, { estado: e.target.value }); render(false); });
  $("#uFav").addEventListener("change", e => { setUser(id, { fav: e.target.checked }); render(false); });
  $("#uNotes").addEventListener("input", e => setUser(id, { notas: e.target.value }));
  $("#dlg").showModal();
}
</script>
</body>
</html>
