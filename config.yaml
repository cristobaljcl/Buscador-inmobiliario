# ============================================================================
#  RADAR INMOBILIARIO · Configuración
#  Edita este archivo para cambiar zonas, filtros e hipótesis de cálculo.
#  Las cifras de mercado (ADR, ocupación, ITP, alquiler €/m²) son estimaciones
#  iniciales: revísalas y ajústalas con tu conocimiento local.
# ============================================================================

email:
  destinatario: cristobalcl85@gmail.com
  copia: [josefinalozano@hotmail.es]   # en copia (CC) del informe de inversión
  top_n: 8                 # nº máximo de oportunidades TOP en el correo
  puntuacion_minima: 55    # solo entran en el TOP los pisos con puntuación >= esto

web:
  url: "https://cristobaljcl.github.io/Buscador-inmobiliario/"
  max_anuncios: 2000       # anuncios que se publican en el panel (los mejor puntuados)
  mapa_consultas_max: 400  # direcciones nuevas a geocodificar por ejecución (OpenStreetMap, 1/s; se guardan en caché)

ia:
  activada: true           # requiere el secreto ANTHROPIC_API_KEY; si no existe se omite sin error
  modelo: claude-opus-5-5
  analizar_top: 5          # nº de pisos del TOP que reciben análisis de IA

# Hipótesis de financiación (método "Tu Primer Piso": hipoteca a tipo fijo)
financiacion:
  ltv: 0.80                # % del precio que financia el banco
  interes: 0.029           # TIN fijo anual
  anios: 30
  gastos_compra_pct: 0.02  # notaría + registro + gestoría + tasación (aprox.)

# Gastos de explotación (larga duración)
gastos_larga:
  comunidad_mes: 60
  ibi_pct_precio: 0.003    # IBI anual aprox. como % del precio
  seguro_hogar_anual: 200
  seguro_impago_pct: 0.04  # % de la renta anual
  vacio_pct: 0.05          # % de la renta anual (meses vacío)
  mantenimiento_pct: 0.06  # % de la renta anual

# Gastos de explotación (vacacional)
gastos_vacacional:
  comunidad_mes: 60
  ibi_pct_precio: 0.003
  seguro_anual: 300
  gestion_pct: 0.20        # gestora (check-in, limpieza coordinada, precios)
  plataforma_pct: 0.15     # comisión Airbnb/Booking
  suministros_mes: 140     # luz, agua, internet, consumibles
  mantenimiento_pct: 0.06
  mobiliario: 7000         # equipamiento inicial
  tope_vs_larga: 1.6       # el ingreso neto vacacional no puede superar 1,6× el alquiler de larga duración del barrio
  exigencia_multiplo: 1.25 # en la puntuación, el múltiplo vacacional se penaliza un 25% (más gestión y riesgo normativo)
  multiplicador_hab: {0: 0.75, 1: 0.8, 2: 1.0, 3: 1.25, 4: 1.45, 5: 1.6}

# Estimación de reforma según palabras clave del anuncio (€/m²)
reforma:
  integral: {eur_m2: 450, palabras: ["a reformar", "para reformar", "necesita reforma", "reforma integral", "para actualizar entero"]}
  parcial:  {eur_m2: 150, palabras: ["a actualizar", "para actualizar", "necesita actualizar", "lavado de cara", "a modernizar"]}

# Señales de oportunidad y de riesgo (búsqueda en título + descripción)
senales:
  oportunidad: ["urge", "urgente", "herencia", "oportunidad", "ocasión", "negociable", "bajada de precio",
                "precio rebajado", "liquidación", "inversores", "rentabilidad", "a reformar", "para reformar"]
  alquilado: ["alquilado", "con inquilino", "inquilino actual", "renta actual"]
  riesgo: ["ocupado", "ocupada", "okupa", "ocupación", "sin posesión", "no se puede visitar", "nuda propiedad",
           "usufructo", "subasta", "cesión de remate", "sin cédula", "sin cedula", "uso turístico no",
           "no apto vivienda", "local reconvertido", "derecho de uso", "proindiviso", "sin financiación",
           "no se puede financiar"]

# Idealista (ver README): alertas por email (IMAP de Gmail) y API oficial
idealista:
  alertas_email: true
  dias_atras: 3
  api:
    activada: true                 # solo funciona si existen IDEALISTA_API_KEY e IDEALISTA_API_SECRET
    peticiones_por_ejecucion: 3    # la cuota gratuita ronda 100/mes → 3/día

pisos_com:
  paginas_venta: 3          # 30 anuncios por página, ordenados por más recientes
  paginas_alquiler: 2       # para calcular €/m² de alquiler real por barrio
  pausa_segundos: [2.5, 5]  # pausa aleatoria entre peticiones (respeto al portal)

fotocasa:
  activada: true
  paginas_venta: 2          # 30 anuncios por página, ordenados por fecha de publicación
  paginas_alquiler: 1       # completa las muestras de alquiler de pisos.com
  pausa_segundos: [3, 6]

# ----------------------------------------------------------------------------
#  ZONAS
#  estrategia: larga | vacacional | jubilacion (ver nombres en 'estrategias')
#  slugs: rutas de pisos.com (https://www.pisos.com/venta/<slug>/)
#  fotocasa: rutas de Fotocasa (https://www.fotocasa.es/es/comprar/viviendas/<slug>/todas-las-zonas/l)
#  idealista_match: palabras para asignar a esta zona los anuncios de las alertas de Idealista
# ----------------------------------------------------------------------------
estrategias:
  larga: Larga duración
  vacacional: Vacacional
  jubilacion: Jubilación gallinos
  ofertas: Ofertas aceptables Madrid

zonas:

  # Va la primera para que las alertas de Idealista de Boadilla (que mencionan "Madrid") se asignen aquí
  - id: boadilla
    nombre: Boadilla del Monte
    provincia: Madrid
    estrategia: jubilacion
    itp: 0.06
    precio_max: 300000
    m2_min: 0                # cualquier vivienda, sea cual sea su estado
    habitaciones_min: 0
    excluir_bajos: false
    exigir_ubicacion: [boadilla]   # pisos.com rellena con anuncios de Pozuelo o Villaviciosa
    paginas_venta: 10        # mercado pequeño: se lee entero cada día
    paginas_alquiler: 0
    alquiler_m2_defecto: 15.0
    slugs: [pisos-boadilla_del_monte]
    fotocasa: [boadilla-del-monte]
    idealista_match: [boadilla]
    idealista_api: {center: "40.4050,-3.8780", distance: 4000}
    # Email diario propio con todas las ofertas vigentes (no entra en el informe de inversión)
    informe: {destinatario: nati.seijas@gmail.com, titulo: "Jubilación gallinos"}

  - id: madrid
    nombre: Madrid
    provincia: Madrid
    estrategia: larga
    itp: 0.06
    precio_max: 250000
    m2_min: 35
    habitaciones_min: 1
    excluir_bajos: false
    # Barrios/distritos descartados (se buscan en la ubicación y el título, sin distinguir tildes ni mayúsculas).
    # "vallecas" cubre Puente de Vallecas, Villa de Vallecas y Ensanche de Vallecas.
    excluir_barrios: ["san cristóbal", vallecas, "santa eugenia"]
    alquiler_m2_defecto: 20.0
    slugs: [pisos-madrid_capital_zona_urbana, pisos-mostoles, pisos-alcorcon, pisos-getafe,
            pisos-leganes, pisos-fuenlabrada]
    fotocasa: [madrid-capital, mostoles, alcorcon, getafe, leganes, fuenlabrada]
    idealista_match: [madrid, móstoles, mostoles, alcorcón, alcorcon, getafe, leganés, leganes, fuenlabrada]
    idealista_api: {center: "40.4168,-3.7038", distance: 15000}
    aviso_normativo: "Zona tensionada (Ley de Vivienda): posibles topes al alquiler en nuevos contratos. Verificar índice de referencia."

  # Todo Madrid capital hasta 300.000 € con 2+ habitaciones; se lee entero cada día
  - id: madrid_ofertas
    nombre: Madrid capital (ofertas)
    provincia: Madrid
    estrategia: ofertas
    itp: 0.06
    precio_max: 300000
    m2_min: 0
    habitaciones_min: 2      # también se filtra en la búsqueda del portal
    excluir_bajos: false
    excluir_barrios: [vallecas, "pan bendito", abrantes]
    # Anuncios que no son una vivienda entera (expresiones regulares sobre título + descripción, sin tildes)
    excluir_texto:
      - 'participacion'
      - 'pro ?indiv'                                     # proindiviso (y la errata "proindivoso")
      - '\b\d{1,2}([.,]\d+)? ?% (de la|del|de una|de un) (vivienda|inmueble|propiedad|piso|casa)'  # "8% de la vivienda"
      - '\bel \d{1,2}([.,]\d+)? ?%? del pleno dominio'   # "se vende el 20 del pleno dominio"
      - '(mitad|cuota|parte) indivisa'
      - 'nuda propiedad'
      - 'cesion de remate'
      - 'cesion de credito|venta de(l)? credito|compra de (deuda|credito)|credito hipotecario'
      - 'casa prefabricada'
      # Viviendas ocupadas o sin posesión ("desocupada" no coincide: \b exige que "ocupad" empiece palabra)
      - '\bocupad[oa]s?\b'
      - '\bokupa'
      - 'sin posesion'
      - '(posible|riesgo de|en situacion de) ocupacion|ocupacion ilegal'
      # Subastas y ventas por pujas (Fotocasa añade "[Datos del portal: subasta]")
      - 'subasta'
      - '\bpuj(a|as|ar)\b'
      - 'mejor postor'
    ids_propios: true        # comparte anuncios con la zona madrid: se guardan aparte para no mezclarlos
    paginas_venta: 100       # hasta 3.000 anuncios por portal (para cuando se acaban)
    paginas_alquiler: 0
    alquiler_de: madrid      # usa los alquileres de la zona madrid para la valoración
    alquiler_m2_defecto: 20.0
    centro: "40.4168,-3.7038"
    slugs: [pisos-madrid_capital_zona_urbana]
    fotocasa: [madrid-capital]
    informe:
      titulo: Ofertas aceptables Madrid
      icono: "🏙️"
      descripcion: "Viviendas en venta en Madrid capital hasta 300.000 €, con 2 habitaciones o más (sin Vallecas, Pan Bendito ni Abrantes)."
      destinatario: cristobalcl85@gmail.com
      copia: [nati.seijas@gmail.com, josefinalozano@hotmail.es]
      listar_todo: false     # son miles: el email lleva novedades y bajadas; el listado completo está en el panel
      descripcion_panel: 400

  - id: murcia
    nombre: Murcia (costa)
    provincia: Murcia
    estrategia: vacacional
    itp: 0.08
    precio_max: 250000
    m2_min: 40
    habitaciones_min: 1
    excluir_bajos: false
    alquiler_m2_defecto: 9.0
    adr_base: 90          # €/noche para 2 habitaciones
    ocupacion: 0.50
    slugs: [pisos-cartagena, pisos-san_javier, pisos-los_alcazares, pisos-san_pedro_del_pinatar,
            pisos-mazarron, pisos-aguilas]
    fotocasa: [cartagena, san-javier, los-alcazares, san-pedro-del-pinatar, mazarron, aguilas]
    idealista_match: [cartagena, "la manga", "san javier", "los alcázares", "los alcazares", "san pedro del pinatar", mazarrón, mazarron, águilas, aguilas, murcia]
    idealista_api: {center: "37.6719,-0.8270", distance: 35000}
    aviso_normativo: "Desde 2025 una nueva VUT requiere aprobación de 3/5 de la comunidad (LPH) y registro único estatal. Verificar normativa municipal."

  - id: alicante
    nombre: Alicante (costa)
    provincia: Alicante
    estrategia: vacacional
    itp: 0.10
    precio_max: 250000
    m2_min: 40
    habitaciones_min: 1
    excluir_bajos: false
    alquiler_m2_defecto: 11.0
    adr_base: 105
    ocupacion: 0.60
    slugs: [pisos-torrevieja, pisos-santa_pola, pisos-benidorm, pisos-alicante_alacant, pisos-denia]
    fotocasa: [torrevieja, santa-pola, benidorm, alicante-alacant, denia]
    idealista_match: [torrevieja, "santa pola", benidorm, alicante, alacant, dénia, denia]
    idealista_api: {center: "38.3452,-0.4810", distance: 40000}
    aviso_normativo: "C. Valenciana (DL 9/2024) endurece licencias VUT; Alicante ciudad mantiene moratoria de nuevas licencias. Verificar municipio y comunidad (3/5 LPH)."

  - id: pontevedra
    nombre: Pontevedra (Rías Baixas)
    provincia: Pontevedra
    estrategia: vacacional
    itp: 0.08
    precio_max: 250000
    m2_min: 40
    habitaciones_min: 1
    excluir_bajos: false
    alquiler_m2_defecto: 10.0
    adr_base: 110
    ocupacion: 0.42
    slugs: [pisos-sanxenxo, pisos-vigo, pisos-pontevedra_capital, pisos-o_grove, pisos-baiona]
    fotocasa: [sanxenxo, vigo, pontevedra-capital, o-grove, baiona]
    idealista_match: [sanxenxo, vigo, pontevedra, "o grove", baiona, cangas]
    idealista_api: {center: "42.3500,-8.7500", distance: 35000}
    aviso_normativo: "Galicia exige inscripción en el REAT. Fuerte estacionalidad (julio-agosto). Verificar ordenanza municipal (Vigo regula VUT en edificios residenciales)."

  - id: coruna
    nombre: A Coruña
    provincia: A Coruña
    estrategia: vacacional
    itp: 0.08
    precio_max: 250000
    m2_min: 40
    habitaciones_min: 1
    excluir_bajos: false
    alquiler_m2_defecto: 11.0
    adr_base: 95
    ocupacion: 0.55
    slugs: [pisos-a_coruna_capital, pisos-santiago_de_compostela, pisos-ferrol]
    fotocasa: [a-coruna-capital, santiago-de-compostela, ferrol]
    idealista_match: ["a coruña", "a coruna", coruña, santiago, ferrol]
    idealista_api: {center: "43.3623,-8.4115", distance: 30000}
    aviso_normativo: "A Coruña y Santiago han restringido mucho las VUT en pisos (en general solo bajos/1ª planta con acceso propio). Comprueba si el anuncio encaja; si no, valora larga duración."
