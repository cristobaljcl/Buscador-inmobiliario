name: Radar inmobiliario diario

on:
  schedule:
    # GitHub usa UTC y suele arrancar con horas de retraso. Se busca a las 2:07 de Madrid (verano 00:07 UTC,
    # invierno 01:07 UTC; se evita la hora en punto, la más saturada) y el script retiene los emails hasta
    # las 7:00. El disparo de las 06:00 UTC es de reserva; el script solo envía una vez al día.
    - cron: "7 0 * * *"
    - cron: "7 1 * * *"
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Ejecutar ya (ignorar hora y envío previo)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 330   # incluye la espera hasta las 7:00 (el máximo de GitHub son 6 h)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # La base de datos y el panel viven en la rama "datos", que solo guarda la última versión (sin historial)
      # para que el repositorio no crezca cada día. Si no se puede leer, no se ejecuta: así nunca se pisan
      # los datos buenos con una copia antigua.
      - name: Recuperar base de datos y panel
        id: restore
        run: |
          git fetch --depth=1 origin datos
          git checkout FETCH_HEAD -- data docs

      - name: Ejecutar radar
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IDEALISTA_API_KEY: ${{ secrets.IDEALISTA_API_KEY }}
          IDEALISTA_API_SECRET: ${{ secrets.IDEALISTA_API_SECRET }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            python -m radar.main --force
          else
            python -m radar.main
          fi

      - name: Guardar base de datos y panel
        if: always() && steps.restore.outcome == 'success'
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git checkout -q --orphan datos-nuevo
          git rm -r -q --cached .
          git add -f data docs
          git commit -q -m "Radar $(date -u +%F)"
          git push -f origin datos-nuevo:datos   # sustituye la versión anterior: un único commit
